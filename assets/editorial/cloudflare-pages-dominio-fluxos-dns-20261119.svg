<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Qual DNS configurar para domínio Hostinger no Cloudflare Pages</title><desc id="d">Comparativo ilustrado entre subdomínio por CNAME no DNS da Hostinger e domínio raiz com nameservers na Cloudflare.</desc><rect width="1200" height="700" rx="24" fill="#101d2b"/><g font-family="Arial,Helvetica,sans-serif"><text x="61" y="79" font-size="44" fill="#f7f9fc" font-weight="800">QUAL CAMINHO DNS ESCOLHER?</text><text x="61" y="121" font-size="22" fill="#b6c9d9">O registro do domínio pode continuar na Hostinger nos dois casos</text><rect x="59" y="167" width="517" height="407" rx="19" fill="#203951" stroke="#57738d"/><rect x="622" y="167" width="517" height="407" rx="19" fill="#203951" stroke="#57738d"/><rect x="84" y="193" width="467" height="58" rx="12" fill="#a6d6e4"/><text x="317" y="232" text-anchor="middle" fill="#18364c" font-size="25" font-weight="800">WWW OU SUBDOMÍNIO</text><rect x="647" y="193" width="467" height="58" rx="12" fill="#ffbf7a"/><text x="881" y="231" text-anchor="middle" fill="#4b2f22" font-size="25" font-weight="800">DOMÍNIO PRINCIPAL</text><g font-size="24" fill="#e7f1f8"><text x="94" y="308">DNS continua na Hostinger</text><text x="94" y="368">CNAME: www</text><text x="94" y="413">Destino: projeto.pages.dev</text><text x="94" y="482">Configurar também no Pages</text><text x="657" y="308">DNS passa para a Cloudflare</text><text x="657" y="368">Troque os nameservers</text><text x="657" y="413">pelos valores da sua conta</text><text x="657" y="482">Copie MX, SPF e DKIM</text></g><rect x="86" y="514" width="452" height="40" rx="12" fill="#356b7d"/><text x="312" y="542" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Evite mexer no DNS do e-mail</text><rect x="649" y="514" width="456" height="40" rx="12" fill="#87542f"/><text x="877" y="542" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">Verifique o e-mail antes da troca</text><path d="M59 622h1080" stroke="#51758a" stroke-width="2"/><text x="62" y="659" fill="#b8cede" font-size="20">Primeiro adicione o domínio em Pages → Custom domains, depois ajuste o DNS</text></g></svg>