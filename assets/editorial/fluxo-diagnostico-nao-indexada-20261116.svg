<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="t d"><title id="t">Fluxo de diagnóstico de uma página descoberta e não indexada</title><desc id="d">Infográfico em quatro etapas: conferir URL, testar acesso, verificar sitemap e links internos, acompanhar rastreamento.</desc><rect width="1200" height="730" rx="25" fill="#0e1c30"/><g font-family="Arial,Helvetica,sans-serif"><text x="63" y="78" fill="#f4f8fd" font-weight="800" font-size="45">O Google descobriu. E agora?</text><text x="63" y="117" fill="#b5c9da" font-size="23">Use a inspeção de URL antes de pedir indexação novamente</text></g><g font-family="Arial,Helvetica,sans-serif"><rect x="60" y="162" width="510" height="206" rx="18" fill="#233b53" stroke="#4e6983" stroke-width="2"/><rect x="628" y="162" width="510" height="206" rx="18" fill="#233b53" stroke="#4e6983" stroke-width="2"/><rect x="60" y="414" width="510" height="206" rx="18" fill="#233b53" stroke="#4e6983" stroke-width="2"/><rect x="628" y="414" width="510" height="206" rx="18" fill="#233b53" stroke="#4e6983" stroke-width="2"/><circle cx="104" cy="210" r="27" fill="#ffb266"/><text x="104" y="220" font-size="28" font-weight="800" text-anchor="middle" fill="#183047">1</text><circle cx="672" cy="210" r="27" fill="#ffb266"/><text x="672" y="220" font-size="28" font-weight="800" text-anchor="middle" fill="#183047">2</text><circle cx="104" cy="462" r="27" fill="#70d3d1"/><text x="104" y="472" font-size="28" font-weight="800" text-anchor="middle" fill="#183047">3</text><circle cx="672" cy="462" r="27" fill="#70d3d1"/><text x="672" y="472" font-size="28" font-weight="800" text-anchor="middle" fill="#183047">4</text><text x="149" y="220" fill="#f5f8fb" font-size="27" font-weight="800">Inspecione a URL</text><text x="717" y="220" fill="#f5f8fb" font-size="27" font-weight="800">Teste o acesso</text><text x="149" y="472" fill="#f5f8fb" font-size="27" font-weight="800">Links e sitemap</text><text x="717" y="472" fill="#f5f8fb" font-size="27" font-weight="800">Acompanhe</text><g font-size="21" fill="#c5d5e1"><text x="89" y="274">Confira o motivo e a data</text><text x="89" y="307">do último rastreamento</text><text x="657" y="274">Verifique HTTP, robots.txt</text><text x="657" y="307">e a indexabilidade real</text><text x="89" y="525">Mantenha o sitemap atual</text><text x="89" y="558">e links de páginas úteis</text><text x="657" y="525">Espere a coleta e reveja</text><text x="657" y="558">o status sem repetir pedidos</text></g><path d="M579 267h38" stroke="#ffb266" stroke-width="8" stroke-linecap="round"/><path d="m607 250 18 17-18 17" fill="none" stroke="#ffb266" stroke-width="8" stroke-linejoin="round"/><path d="M882 381v20" stroke="#70d3d1" stroke-width="8" stroke-linecap="round"/><path d="m866 394 16 18 16-18" fill="none" stroke="#70d3d1" stroke-width="8" stroke-linejoin="round"/><path d="M616 520h-37" stroke="#70d3d1" stroke-width="8" stroke-linecap="round"/><path d="m586 504-16 16 16 16" fill="none" stroke="#70d3d1" stroke-width="8" stroke-linejoin="round"/><text x="63" y="683" fill="#abc2d3" font-size="20">Indexar nunca é garantido: a decisão final é dos sistemas de busca</text></g></svg>