<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d"><title id="t">Dois caminhos para publicar no Cloudflare Pages</title><desc id="d">Infográfico que compara envio direto de pasta ou ZIP e GitHub com publicação automática.</desc><rect width="1200" height="640" rx="24" fill="#0e1c2f"/><text x="70" y="87" fill="#f7fafc" font-family="Arial,Helvetica,sans-serif" font-size="45" font-weight="800">2 jeitos de colocar HTML no ar</text><text x="70" y="124" fill="#bed0df" font-family="Arial,Helvetica,sans-serif" font-size="23">O arquivo index.html precisa estar na raiz da pasta publicada</text><g font-family="Arial,Helvetica,sans-serif"><rect x="65" y="175" width="515" height="355" rx="19" fill="#20364d" stroke="#48627c"/><rect x="620" y="175" width="515" height="355" rx="19" fill="#20364d" stroke="#48627c"/><rect x="87" y="198" width="193" height="41" rx="20" fill="#ffad5e"/><text x="184" y="225" text-anchor="middle" fill="#1b2d42" font-size="21" font-weight="800">ENVIO DIRETO</text><rect x="644" y="198" width="180" height="41" rx="20" fill="#6fdae0"/><text x="734" y="225" text-anchor="middle" fill="#1b2d42" font-size="21" font-weight="800">VIA GITHUB</text><rect x="91" y="282" width="160" height="76" rx="14" fill="#eaf2f8"/><rect x="284" y="282" width="261" height="76" rx="14" fill="#f9c47d"/><text x="171" y="315" text-anchor="middle" font-size="21" font-weight="800" fill="#1b3347">Pasta/ZIP</text><text x="171" y="342" text-anchor="middle" font-size="17" fill="#435d70">index.html</text><text x="414" y="327" text-anchor="middle" font-size="24" font-weight="800" fill="#203549">Arrastar arquivos</text><text x="269" y="327" fill="#fff" font-size="31">→</text><rect x="646" y="282" width="193" height="76" rx="14" fill="#eaf2f8"/><rect x="871" y="282" width="235" height="76" rx="14" fill="#81c9d1"/><text x="742" y="313" text-anchor="middle" font-size="20" font-weight="800" fill="#19324a">Repositório</text><text x="742" y="337" text-anchor="middle" font-size="17" fill="#435d70">main / pasta</text><text x="989" y="313" text-anchor="middle" font-size="21" font-weight="800" fill="#203549">Deploy</text><text x="989" y="337" text-anchor="middle" font-size="17" fill="#244359">a cada push</text><text x="851" y="327" fill="#fff" font-size="31">→</text><text x="92" y="405" font-size="21" fill="#fff" font-weight="700">Bom para testar um site pronto</text><text x="92" y="445" font-size="19" fill="#b9ccd9">A atualização é um novo upload</text><text x="646" y="405" font-size="21" fill="#fff" font-weight="700">Bom para sites que mudam sempre</text><text x="646" y="445" font-size="19" fill="#b9ccd9">GitHub publica a versão nova</text><path d="M67 571H1132" stroke="#56718a" stroke-width="2"/><text x="69" y="602" font-size="18" fill="#a8c1d4">Escolha o método ao criar o projeto: não é possível trocar diretamente de um para o outro</text></g></svg>