<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">O que sai com o código e o que precisa ser migrado</title><desc id="d">Infográfico original em duas colunas com itens de código exportável e itens de backend que precisam de atenção separada.</desc><rect width="1200" height="680" rx="22" fill="#101827"/><g font-family="Arial,Helvetica,sans-serif"><text x="61" y="82" font-size="45" font-weight="800" fill="#f5f5fa">EXPORTAR CÓDIGO ≠ MIGRAR O APP</text><text x="61" y="122" font-size="23" fill="#bdcad8">Checklist prático antes de mudar de plataforma</text><rect x="60" y="164" width="520" height="413" rx="17" fill="#23364b" stroke="#5b788e"/><rect x="620" y="164" width="520" height="413" rx="17" fill="#2f2945" stroke="#7d668f"/><rect x="84" y="192" width="465" height="62" rx="12" fill="#8bd2d0"/><rect x="644" y="192" width="465" height="62" rx="12" fill="#dbafe9"/><text x="317" y="231" text-anchor="middle" font-size="28" font-weight="800" fill="#133441">VEM NO REPOSITÓRIO</text><text x="877" y="231" text-anchor="middle" font-size="27" font-weight="800" fill="#30243f">EXIGE MIGRAÇÃO À PARTE</text><g fill="#ecf5f8" font-size="24"><text x="90" y="311">✓ Arquivos e componentes</text><text x="90" y="369">✓ Estilos e rotas</text><text x="90" y="427">✓ Configuração do projeto</text><text x="90" y="485">✓ Migrações presentes no código</text><text x="650" y="311">• Dados de tabelas</text><text x="650" y="369">• Fotos e arquivos do Storage</text><text x="650" y="427">• Login, provedores e sessões</text><text x="650" y="485">• Chaves, funções e integrações</text></g><text x="68" y="629" font-size="21" fill="#b9c6d8">Faça um teste completo antes de transferir tráfego para a nova hospedagem.</text></g></svg>