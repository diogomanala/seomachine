<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="t d"><title id="t">Caminho para criar botão de WhatsApp flutuante no Elementor gratuito</title><desc id="d">Fluxo em quatro passos: WordPress, Modelos, Elementos flutuantes, selecionar WhatsApp e publicar</desc><rect width="1100" height="350" rx="16" fill="#F4F8FC"/><text x="37" y="59" font-size="29" font-weight="800" font-family="Arial,Helvetica,sans-serif" fill="#153047">Crie o botão nativo em quatro etapas</text><text x="37" y="91" font-size="18" font-family="Arial,Helvetica,sans-serif" fill="#486075">O recurso é um modelo flutuante, criado no painel do WordPress.</text><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="34" y="130" width="235" height="150" rx="18" fill="#16384D"/><text x="151" y="182" font-weight="800" font-size="21" fill="#59E5B0">1 • WORDPRESS</text><text x="151" y="217" fill="#EAF4FC" font-size="18">Abrir Elementor</text><rect x="300" y="130" width="235" height="150" rx="18" fill="#16384D"/><text x="417" y="182" font-weight="800" font-size="21" fill="#59E5B0">2 • MODELOS</text><text x="417" y="217" fill="#EAF4FC" font-size="18">Elementos flutuantes</text><rect x="566" y="130" width="235" height="150" rx="18" fill="#16384D"/><text x="683" y="182" font-weight="800" font-size="21" fill="#59E5B0">3 • WHATSAPP</text><text x="683" y="217" fill="#EAF4FC" font-size="18">Selecionar + número</text><rect x="832" y="130" width="235" height="150" rx="18" fill="#086349"/><text x="949" y="182" font-weight="800" font-size="21" fill="#FFFFFF">4 • PUBLICAR</text><text x="949" y="217" fill="#F5FFFA" font-size="18">Testar no celular</text></g><g stroke="#D7AA29" stroke-width="6" stroke-linecap="round" fill="none"><path d="M275 205h18m-12-8 10 8-10 8"/><path d="M541 205h18m-12-8 10 8-10 8"/><path d="M807 205h18m-12-8 10 8-10 8"/></g><text x="37" y="323" fill="#4A6379" font-family="Arial,Helvetica,sans-serif" font-size="17">Nomes dos menus podem mudar conforme a versão do Elementor.</text></svg>