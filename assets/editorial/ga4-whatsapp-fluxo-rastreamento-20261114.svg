<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="t d"><title id="t">Como o GA4 conta cliques externos do WhatsApp</title><desc id="d">Quatro passos: visitante clica, GA4 registra evento click, identifica domínio wa.me, relatório mostra contagem de eventos</desc>
<rect width="1200" height="390" fill="#F1F6FA" rx="19"/><text x="40" y="62" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="800" fill="#17334A">Do clique ao relatório no Google Analytics</text><text x="40" y="94" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#4B6379">Medir um clique no site é diferente de confirmar uma mensagem enviada.</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="34" y="138" width="259" height="168" rx="18" fill="#173B51"/><text x="164" y="193" font-weight="800" font-size="23" fill="#67E8B4">1. VISITANTE</text><text x="164" y="230" font-size="18" fill="white">Toca no botão</text><text x="164" y="256" font-size="18" fill="white">do WhatsApp</text>
<rect x="328" y="138" width="259" height="168" rx="18" fill="#173B51"/><text x="458" y="193" font-weight="800" font-size="23" fill="#67E8B4">2. EVENTO</text><text x="458" y="230" font-size="18" fill="white">GA4 registra</text><text x="458" y="256" font-size="18" fill="white">o evento click</text>
<rect x="622" y="138" width="259" height="168" rx="18" fill="#173B51"/><text x="752" y="193" font-weight="800" font-size="23" fill="#67E8B4">3. FILTRO</text><text x="752" y="230" font-size="18" fill="white">link_domain</text><text x="752" y="256" font-size="18" fill="white">igual a wa.me</text>
<rect x="916" y="138" width="252" height="168" rx="18" fill="#096044"/><text x="1042" y="193" font-weight="800" font-size="23" fill="white">4. RELATÓRIO</text><text x="1042" y="230" font-size="18" fill="white">Contagem de</text><text x="1042" y="256" font-size="18" fill="white">cliques</text></g>
<g stroke="#D4A835" stroke-width="6" stroke-linecap="round" fill="none"><path d="M299 219h22m-12-8 10 8-10 8"/><path d="M593 219h22m-12-8 10 8-10 8"/><path d="M887 219h22m-12-8 10 8-10 8"/></g><text x="40" y="360" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#3F5B70">Funciona para links externos padrão, com medição otimizada habilitada e consentimento adequado.</text></svg>