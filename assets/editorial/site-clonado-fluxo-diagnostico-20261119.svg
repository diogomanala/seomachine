<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Diagnóstico de site clonado que não abre</title><desc id="d">Fluxograma original com sinais de erro e ações: tela branca, CSS e imagens faltando, animações paradas e formulários inativos.</desc><rect width="1200" height="720" rx="24" fill="#0e1d30"/><g font-family="Arial,Helvetica,sans-serif"><text x="61" y="77" fill="#f0f7fb" font-size="45" font-weight="800">Qual problema você está vendo?</text><text x="62" y="120" fill="#b8ccda" font-size="22">Abra DevTools → Console + Network e comece pelo erro concreto</text><rect x="62" y="168" width="515" height="211" rx="17" fill="#21374c" stroke="#52738b"/><rect x="619" y="168" width="515" height="211" rx="17" fill="#21374c" stroke="#52738b"/><rect x="62" y="418" width="515" height="211" rx="17" fill="#21374c" stroke="#52738b"/><rect x="619" y="418" width="515" height="211" rx="17" fill="#21374c" stroke="#52738b"/><rect x="87" y="195" width="211" height="45" rx="14" fill="#f3b991"/><text x="193" y="225" text-anchor="middle" font-size="22" font-weight="800" fill="#183348">TELA EM BRANCO</text><rect x="644" y="195" width="270" height="45" rx="14" fill="#d5f5a1"/><text x="779" y="225" text-anchor="middle" font-size="22" font-weight="800" fill="#193747">SEM CSS / IMAGENS</text><rect x="87" y="444" width="271" height="45" rx="14" fill="#d8c4ff"/><text x="222" y="475" text-anchor="middle" font-size="22" font-weight="800" fill="#292647">ANIMAÇÃO PARADA</text><rect x="644" y="444" width="290" height="45" rx="14" fill="#9ce8e0"/><text x="789" y="475" text-anchor="middle" font-size="22" font-weight="800" fill="#123946">FORMULÁRIO NÃO ENVIA</text><g font-size="23" fill="#e3edf4"><text x="89" y="285">Teste com localhost e procure</text><text x="89" y="326">erro de módulo ou script.</text><text x="648" y="285">Confira 404, caminhos e nomes</text><text x="648" y="326">de arquivos na aba Network.</text><text x="89" y="534">Revise GSAP, ScrollTrigger,</text><text x="89" y="575">Lenis e dependências.</text><text x="648" y="534">Verifique API, servidor, CORS,</text><text x="648" y="575">auth e endpoint de envio.</text></g><text x="63" y="684" font-size="20" fill="#b8cad9">Front-end capturado não inclui automaticamente backend e dados privados.</text></g></svg>