<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="t d"><title id="t">Três caminhos oficiais para recuperar a verificação em duas etapas GOV.BR</title><desc id="d">Infográfico editorial original: e-mail de recuperação cadastrado, CIN física, atendimento oficial caso as outras alternativas falhem.</desc><rect width="1200" height="690" rx="24" fill="#0e2138"/><g font-family="Arial,Helvetica,sans-serif"><text x="59" y="79" font-size="43" font-weight="800" fill="#f4faff">3 caminhos oficiais de recuperação</text><text x="60" y="117" font-size="23" fill="#b8d5e8">No app GOV.BR: “Estou com dificuldade para gerar o código”</text><rect x="59" y="171" width="345" height="415" rx="18" fill="#203d59" stroke="#5486a5"/><rect x="427" y="171" width="345" height="415" rx="18" fill="#203d59" stroke="#5486a5"/><rect x="795" y="171" width="345" height="415" rx="18" fill="#203d59" stroke="#5486a5"/><circle cx="110" cy="231" r="29" fill="#bcefff"/><text x="110" y="241" fill="#11415a" font-size="30" text-anchor="middle" font-weight="800">1</text><circle cx="478" cy="231" r="29" fill="#bcefff"/><text x="478" y="241" fill="#11415a" font-size="30" text-anchor="middle" font-weight="800">2</text><circle cx="846" cy="231" r="29" fill="#bcefff"/><text x="846" y="241" fill="#11415a" font-size="30" text-anchor="middle" font-weight="800">3</text><g fill="#fff" font-size="29" font-weight="800"><text x="91" y="307">E-MAIL</text><text x="459" y="307">CIN FÍSICA</text><text x="827" y="307">SUPORTE</text></g><g fill="#d0e1ed" font-size="22"><text x="91" y="367">Precisa ter cadastrado</text><text x="91" y="401">o e-mail específico</text><text x="91" y="435">para recuperar a</text><text x="91" y="469">verificação em duas</text><text x="91" y="503">etapas.</text><text x="459" y="367">Documento físico</text><text x="459" y="401">com QR code,</text><text x="459" y="435">reconhecimento facial</text><text x="459" y="469">e contato cadastrado.</text><text x="827" y="367">Quando as opções</text><text x="827" y="401">anteriores não estão</text><text x="827" y="435">disponíveis, abra um</text><text x="827" y="469">chamado oficial.</text></g><text x="61" y="641" font-size="20" fill="#a4c6d9">Não compartilhe CPF, senha nem códigos com sites ou contatos terceiros.</text></g></svg>