<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc"><title id="title">Jornada de conteúdo a clientes: cinco etapas</title><desc id="desc">Conteúdo e descoberta, conversa, diagnóstico, proposta e aprendizado contínuo, com setas e objetivos de cada etapa.</desc>
<rect width="1200" height="390" rx="20" fill="#F5F8FC"/><text x="48" y="64" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800" fill="#18324A">Como funciona o funil de 2027 na prática</text><text x="48" y="96" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#4A6177">Uma história desperta interesse. Cada etapa entrega uma próxima ação útil.</text>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="41" y="135" width="202" height="146" rx="18" fill="#15304A"/><text x="142" y="184" font-size="22" font-weight="700" fill="#FFD35A">01 • CONTEÚDO</text><text x="142" y="219" font-size="17" fill="#EFF6FC">História, vídeo</text><text x="142" y="242" font-size="17" fill="#EFF6FC">ou busca</text>
<rect x="272" y="135" width="202" height="146" rx="18" fill="#15304A"/><text x="373" y="184" font-size="22" font-weight="700" fill="#FFD35A">02 • CONVERSA</text><text x="373" y="219" font-size="17" fill="#EFF6FC">Pergunta, resposta</text><text x="373" y="242" font-size="17" fill="#EFF6FC">e interesse</text>
<rect x="503" y="135" width="202" height="146" rx="18" fill="#15304A"/><text x="604" y="184" font-size="21" font-weight="700" fill="#FFD35A">03 • DIAGNÓSTICO</text><text x="604" y="219" font-size="17" fill="#EFF6FC">Identificar</text><text x="604" y="242" font-size="17" fill="#EFF6FC">necessidade real</text>
<rect x="734" y="135" width="202" height="146" rx="18" fill="#15304A"/><text x="835" y="184" font-size="22" font-weight="700" fill="#FFD35A">04 • OFERTA</text><text x="835" y="219" font-size="17" fill="#EFF6FC">Solução adequada</text><text x="835" y="242" font-size="17" fill="#EFF6FC">ao contexto</text>
<rect x="965" y="135" width="202" height="146" rx="18" fill="#FFD35A"/><text x="1066" y="184" font-size="22" font-weight="800" fill="#18324A">05 • LOOP</text><text x="1066" y="219" font-size="17" fill="#18324A">Medir, aprender</text><text x="1066" y="242" font-size="17" fill="#18324A">e melhorar</text></g>
<g stroke="#D29B16" stroke-width="5" stroke-linecap="round" fill="none"><path d="M248 210h19m-12-8 10 8-10 8"/><path d="M479 210h19m-12-8 10 8-10 8"/><path d="M710 210h19m-12-8 10 8-10 8"/><path d="M941 210h19m-12-8 10 8-10 8"/></g><path d="M1066 297v41H142v-41" fill="none" stroke="#4A677F" stroke-width="3" stroke-dasharray="9 10"/><path d="m132 311 10-17 10 17" fill="none" stroke="#4A677F" stroke-width="3"/><text x="592" y="368" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#4A6177" text-anchor="middle">As dúvidas coletadas alimentam novos conteúdos e melhoram o próximo ciclo.</text></svg>